apply plugin: 'com.android.library'

// Allow for project-level definition of certain versions. If such does not exist, use defaults.
// -- compileSdk
def dabMpg123CompileSdkVersion
if (rootProject.hasProperty('compileSdkVersion') && rootProject.ext.compileSdkVersion) {
    dabMpg123CompileSdkVersion = rootProject.ext.compileSdkVersion
} else {
    dabMpg123CompileSdkVersion = 33
}
// -- ndk
def dabMpg123NdkVersion
if (rootProject.hasProperty('ndkVersion') && rootProject.ext.ndkVersion) {
    dabMpg123NdkVersion = rootProject.ext.ndkVersion
} else {
    dabMpg123NdkVersion = "25.1.8937393"
}
// -- NDK clangVersion (must match with what ndk provides!)
def dabMpg123ClangVersion
if (rootProject.hasProperty('clangVersion') && rootProject.ext.clangVersion) {
    dabMpg123ClangVersion = rootProject.ext.clangVersion
} else {
    dabMpg123ClangVersion = "14.0.6"
}
// -- minSdk
def dabMpg123MinSdkVersion
if (rootProject.hasProperty('minSdkVersion') && rootProject.ext.minSdkVersion) {
    dabMpg123MinSdkVersion = rootProject.ext.minSdkVersion
} else {
    dabMpg123MinSdkVersion = 23
}
// -- targetSdk
def dabMpg123TargetSdkVersion
if (rootProject.hasProperty('targetSdkVersion') && rootProject.ext.targetSdkVersion) {
    dabMpg123TargetSdkVersion = rootProject.ext.targetSdkVersion
} else {
    dabMpg123TargetSdkVersion = 31
}
println("dabmpg123plugin: targetSdk:" + dabMpg123TargetSdkVersion
        + ", compileSdk:" + dabMpg123CompileSdkVersion
        + ", minSdkVersion:" + dabMpg123MinSdkVersion
        + ", ndkVersion:" + dabMpg123NdkVersion
        + ", clangVersion:" + dabMpg123ClangVersion)


android {
    compileSdk dabMpg123CompileSdkVersion
    ndkVersion dabMpg123NdkVersion
    namespace 'de.irt.dabmpg123decoderplugin'
    defaultConfig {
        minSdkVersion dabMpg123MinSdkVersion
        //noinspection OldTargetApi
        targetSdkVersion dabMpg123TargetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'proguard-rules.pro'
            debuggable false
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }
    packagingOptions {
        // avoid errors like "More than one file was found with OS independent path 'lib/.../libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'

        pickFirst 'lib/arm64-v8a/libmpg123plug.so'
        pickFirst 'lib/x86_64/libmpg123plug.so'
        pickFirst 'lib/x86/libmpg123plug.so'
        pickFirst 'lib/armeabi-v7a/libmpg123plug.so'

        pickFirst 'lib/arm64-v8a/libmpg123.so'
        pickFirst 'lib/x86_64/libmpg123.so'
        pickFirst 'lib/x86/libmpg123.so'
        pickFirst 'lib/armeabi-v7a/libmpg123.so'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api project(path: ':dabaudiodecoderplugininterface')
}

tasks.register('cleanNdkBuild') {
    dependsOn clean
    doLast {
        delete(file("$projectDir").absolutePath + '/.cxx')
        delete(file("$projectDir").absolutePath + '/obj')
        delete(file("$projectDir").absolutePath + '/libs')
    }
}
